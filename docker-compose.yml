services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chipbase}
      POSTGRES_USER: ${POSTGRES_USER:-chipbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - chipbase_pgdata:/var/lib/postgresql/data
      - ./infrastructure/sql/001_platform.sql:/docker-entrypoint-initdb.d/001_platform.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chipbase} -d ${POSTGRES_DB:-chipbase}']
      interval: 5s
      retries: 10
volumes:
  chipbase_pgdata:
